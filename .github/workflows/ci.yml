name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan Git history for secrets
        run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact=100 --no-banner /repo

      - name: Validate Compose configuration and loopback port bindings
        env:
          DOCUMENT_PLATFORM_REVIEW_OPERATOR_TOKEN: ci-placeholder-token-for-compose-validation-only
        run: |
          docker compose --profile '*' config --format json |
            python3 scripts/check_compose_loopback.py

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --all-groups --locked

      - name: Generate Python runtime SBOM
        run: |
          mkdir -p artifacts
          uv export --preview-features sbom-export --format cyclonedx1.5 --no-dev --locked --offline --quiet --output-file artifacts/python-runtime.cdx.json
          jq -e '.bomFormat == "CycloneDX" and .specVersion == "1.5" and .metadata.component.name == "ai-document-processing-platform" and ([.components[].name] | index("fastapi") != null and index("pytest") == null)' artifacts/python-runtime.cdx.json

      - name: Upload Python runtime SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-runtime-sbom
          path: artifacts/python-runtime.cdx.json
          if-no-files-found: error
          retention-days: 14

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run pyright

      - name: Test with coverage
        run: uv run pytest

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage
          path: |
            coverage.xml
            htmlcov
          if-no-files-found: warn
          retention-days: 14

  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/operator-console

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          version: 11.23.0
          runtime: node@24
          cache: true
          cache-dependency-path: apps/operator-console/pnpm-lock.yaml
          package-json-file: apps/operator-console/package.json
          install: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate frontend runtime SBOM
        run: |
          mkdir -p ../../artifacts
          pnpm sbom --sbom-format cyclonedx --sbom-type application --lockfile-only --prod > ../../artifacts/frontend-runtime.cdx.json
          jq -e '.bomFormat == "CycloneDX" and .specVersion == "1.7" and .metadata.component.name == "operator-console" and .metadata.component.type == "application" and ([.components[].name] | index("react") != null and index("typescript") == null)' ../../artifacts/frontend-runtime.cdx.json

      - name: Upload frontend runtime SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-runtime-sbom
          path: artifacts/frontend-runtime.cdx.json
          if-no-files-found: error
          retention-days: 14

      - name: Check operator console
        run: pnpm check

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          path: apps/operator-console/coverage
          if-no-files-found: warn
          retention-days: 14
