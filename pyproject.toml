[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ai-document-processing-platform"
version = "0.8.0.dev0"
description = "Local-first extraction, validation, and review of business documents."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Pietro Russo" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "alembic>=1.20,<2",
  "anyio>=4.12,<5",
  "asyncpg>=0.31,<1",
  "fastapi>=0.137,<1",
  "prometheus-client>=0.24,<1",
  "pydantic-settings>=2.12,<3",
  "pymupdf>=1.26,<2",
  "python-multipart>=0.0.22,<1",
  "sqlalchemy[asyncio]>=2.0.51,<2.1",
  "temporalio>=1.15,<2",
  "uvicorn[standard]>=0.41,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pyright>=1.1.407,<2",
  "pytest>=9.0,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<1",
  "testcontainers[postgres]>=4.13,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/document_platform"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=document_platform",
  "--cov-report=term-missing",
  "--cov-report=xml:coverage.xml",
  "--cov-report=html:htmlcov",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
relative_files = true
source = ["document_platform"]

[tool.coverage.report]
fail_under = 85
precision = 1
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
