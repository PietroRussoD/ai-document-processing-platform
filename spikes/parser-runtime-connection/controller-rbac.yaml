apiVersion: v1
kind: Namespace
metadata:
  name: pdf-parser-probe
  labels:
    parser.platform/admission: restricted
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: parser-controller
  namespace: pdf-parser-probe
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: parser-controller
  namespace: pdf-parser-probe
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: parser-controller
  namespace: pdf-parser-probe
subjects:
  - kind: ServiceAccount
    name: parser-controller
    namespace: pdf-parser-probe
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: parser-controller
