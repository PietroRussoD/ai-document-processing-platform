name: ai-document-processing-platform

services:
  api:
    profiles: ["app", "processing"]
    image: document-platform-api:dev
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DOCUMENT_PLATFORM_DATABASE_URL: postgresql+asyncpg://document_platform:local-development-only@postgres:5432/document_platform
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2).close()"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    volumes:
      - document-platform-data:/app/data

  console:
    profiles: ["processing"]
    build: ./apps/operator-console
    image: document-platform-console:dev
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CONSOLE_PORT:-8088}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  dispatcher:
    profiles: ["processing"]
    image: document-platform-api:dev
    command: ["python", "-m", "document_platform.dispatcher"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
    environment:
      DOCUMENT_PLATFORM_DATABASE_URL: postgresql+asyncpg://document_platform:local-development-only@postgres:5432/document_platform
      DOCUMENT_PLATFORM_TEMPORAL_TARGET_HOST: temporal:7233
    restart: unless-stopped

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:13.2.2
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: local-development-only
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/document-platform.json
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    volumes:
      - ./ops/observability/grafana/provisioning/datasources/prometheus.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./ops/observability/grafana/provisioning/dashboards/document-platform.yml:/etc/grafana/provisioning/dashboards/document-platform.yml:ro
      - ./ops/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - document-platform-grafana:/var/lib/grafana

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    volumes:
      - ./ops/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - document-platform-prometheus:/prometheus

  migrate:
    profiles: ["app", "processing"]
    build: .
    image: document-platform-api:dev
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DOCUMENT_PLATFORM_DATABASE_URL: postgresql+asyncpg://document_platform:local-development-only@postgres:5432/document_platform

  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: document_platform
      POSTGRES_USER: document_platform
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U document_platform -d document_platform"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    volumes:
      - document-platform-postgres:/var/lib/postgresql

  temporal-postgres:
    profiles: ["temporal", "processing"]
    image: postgres:16.11
    environment:
      POSTGRES_DB: temporal
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal-local-development-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    volumes:
      - document-platform-temporal-postgres:/var/lib/postgresql

  temporal:
    profiles: ["temporal", "processing"]
    image: temporalio/auto-setup:1.28.1
    depends_on:
      temporal-postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal-local-development-only
      POSTGRES_SEEDS: temporal-postgres
    ports:
      - "127.0.0.1:${TEMPORAL_PORT:-7233}:7233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233", "--command-timeout", "2s"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  temporal-ui:
    profiles: ["temporal", "processing"]
    image: temporalio/ui:2.26.2
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "127.0.0.1:${TEMPORAL_UI_PORT:-8233}:8080"

  worker:
    profiles: ["processing"]
    image: document-platform-api:dev
    command: ["python", "-m", "document_platform.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
    environment:
      DOCUMENT_PLATFORM_DATABASE_URL: postgresql+asyncpg://document_platform:local-development-only@postgres:5432/document_platform
      DOCUMENT_PLATFORM_TEMPORAL_TARGET_HOST: temporal:7233
      DOCUMENT_PLATFORM_OLLAMA_ENABLED: ${DOCUMENT_PLATFORM_OLLAMA_ENABLED:-false}
      DOCUMENT_PLATFORM_OLLAMA_BASE_URL: ${OLLAMA_COMPOSE_BASE_URL:-http://host.docker.internal:11434}
      DOCUMENT_PLATFORM_OLLAMA_MODEL_REFERENCE: ${DOCUMENT_PLATFORM_OLLAMA_MODEL_REFERENCE:-qwen3:8b}
      DOCUMENT_PLATFORM_OLLAMA_TIMEOUT_SECONDS: ${DOCUMENT_PLATFORM_OLLAMA_TIMEOUT_SECONDS:-60}
      DOCUMENT_PLATFORM_OLLAMA_MAX_CONCURRENT_REQUESTS: ${DOCUMENT_PLATFORM_OLLAMA_MAX_CONCURRENT_REQUESTS:-1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    volumes:
      - document-platform-data:/app/data

volumes:
  document-platform-data:
  document-platform-grafana:
  document-platform-postgres:
  document-platform-prometheus:
  document-platform-temporal-postgres:
